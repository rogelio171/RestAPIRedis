spring.application.name=RestAPIRedis

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Redis Caching ──
spring.cache.type=redis
spring.cache.redis.key-prefix=restapi-redis::
spring.cache.redis.use-key-prefix=true
spring.cache.redis.time-to-live=600000

# ── Actuator ──
management.endpoints.web.exposure.include=health,info,metrics,caches

# ── Security ──
app.security.mode=jwt

# JWT mode settings
app.security.jwt.secret=change-me-to-a-secure-random-string-at-least-32-chars
app.security.jwt.expiration-ms=3600000

# OAuth2 mode settings (uncomment when mode=oauth2)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-auth-server.com

# ── OpenAPI ──
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ──
logging.level.com.roger.redis=INFO
